
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e30000">

    <title>Helados | Fruna Osorno</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #ff1717, #b80000);
            color: white;
            text-align: center;
            padding: 20px 12px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 900;
            font-style: italic;
        }

        header p {
            font-size: 13px;
            margin-top: 5px;
        }

        main {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        .instruction {
            text-align: center;
            padding: 12px;
            font-size: 13px;
            color: #666;
        }

        .poster {
            display: block;
            width: 100%;
            height: auto;
            cursor: zoom-in;
        }

        .open-button {
            display: block;
            width: 90%;
            margin: 18px auto;
            padding: 15px;
            background: #e30000;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Visor de pantalla completa */

        .fullscreen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            background: #000;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        .fullscreen.active {
            display: flex;
        }

        .fullscreen img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            touch-action: pinch-zoom;
        }

        .close-button {
            position: fixed;
            top: calc(15px + env(safe-area-inset-top));
            right: 15px;
            width: 42px;
            height: 42px;
            background: rgba(50, 50, 50, 0.85);
            color: white;
            border: 1px solid #ffffff30;
            border-radius: 50%;
            font-size: 26px;
            cursor: pointer;
            z-index: 10000;
        }

        body.locked {
            overflow: hidden;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>Fruna Osorno</h1>
        <p>Catálogo digital de helados</p>
    </header>

    <main>

        <p class="instruction">
            Toca el cartel para verlo en pantalla completa
        </p>

        <img
            class="poster"
            src="helados.png"
            alt="Cartel de helados Fruna Osorno"
            onclick="openImage()"
        >

        <button class="open-button" onclick="openImage()">
            Ver en pantalla completa
        </button>

        <footer>
            Fruna Osorno · Catálogo de helados
        </footer>

    </main>

    <div class="fullscreen" id="fullscreen">

        <button
            class="close-button"
            onclick="closeImage()"
            aria-label="Cerrar imagen">
            &times;
        </button>

        <img
            src="helados.png"
            alt="Catálogo de helados ampliado"
        >

    </div>

    <script>
        const fullscreen = document.getElementById("fullscreen");

        function openImage() {
            fullscreen.classList.add("active");
            document.body.classList.add("locked");
        }

        function closeImage() {
            fullscreen.classList.remove("active");
            document.body.classList.remove("locked");
        }

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeImage();
            }
        });
    </script>

</body>
</html>
