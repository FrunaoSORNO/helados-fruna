
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#e30000">

    <title>Helados | Fruna Osorno</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            color: #222;
            min-height: 100dvh;
        }

        header {
            background: linear-gradient(135deg, #ff1717, #b80000);
            color: white;
            text-align: center;
            padding: 18px 12px;
        }

        header h1 {
            font-size: 26px;
            font-weight: 900;
            font-style: italic;
        }

        header p {
            font-size: 13px;
            margin-top: 5px;
        }

        main {
            width: 100%;
            max-width: 850px;
            margin: auto;
            padding-bottom: 100px;
        }

        .instruction {
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        .viewer {
            width: 100%;
            overflow: auto;
            background: #003675;
            overscroll-behavior-x: contain;
        }

        .poster {
            display: block;
            width: 100%;
            max-width: none;
            height: auto;
            cursor: zoom-in;
        }

        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 -4px 25px #0002;
            z-index: 100;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            border-radius: 12px;
            min-height: 48px;
        }

        .zoom-button {
            background: #e30000;
            color: white;
            width: 48px;
            font-size: 26px;
        }

        button:disabled {
            opacity: .4;
            cursor: default;
        }

        .reset-button {
            background: #eeeeee;
            color: #333;
            padding: 0 15px;
            font-size: 13px;
        }

        #zoom-level {
            min-width: 48px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>Fruna Osorno</h1>
        <p>Catálogo digital de helados</p>
    </header>

    <main>

        <div class="instruction">
            🔍 Toca el cartel o utiliza los botones para ampliar
        </div>

        <div class="viewer" id="viewer">
            <img
                id="poster"
                class="poster"
                src="helados.png"
                alt="Cartel de helados Fruna Osorno"
                fetchpriority="high"
            >
        </div>

        <footer>
            Fruna Osorno · Catálogo de helados
        </footer>

    </main>

    <div class="controls">

        <button
            id="minus"
            class="zoom-button"
            onclick="changeZoom(-25)"
            aria-label="Reducir imagen">
            −
        </button>

        <span id="zoom-level">100%</span>

        <button
            id="plus"
            class="zoom-button"
            onclick="changeZoom(25)"
            aria-label="Ampliar imagen">
            +
        </button>

        <button
            class="reset-button"
            onclick="resetZoom()">
            Restablecer
        </button>

    </div>

    <script>
        let zoom = 100;

        const poster = document.getElementById("poster");
        const viewer = document.getElementById("viewer");
        const zoomLevel = document.getElementById("zoom-level");
        const minus = document.getElementById("minus");
        const plus = document.getElementById("plus");

        function updateZoom() {
            poster.style.width = zoom + "%";
            zoomLevel.textContent = zoom + "%";

            minus.disabled = zoom <= 100;
            plus.disabled = zoom >= 300;

            poster.style.cursor =
                zoom >= 300 ? "zoom-out" : "zoom-in";
        }

        function changeZoom(amount) {
            zoom = Math.max(100, Math.min(300, zoom + amount));
            updateZoom();
        }

        function resetZoom() {
            zoom = 100;
            updateZoom();
            viewer.scrollLeft = 0;
        }

        poster.addEventListener("click", () => {
            if (zoom >= 300) {
                resetZoom();
            } else {
                changeZoom(50);
            }
        });

        updateZoom();
    </script>

</body>
</html>
